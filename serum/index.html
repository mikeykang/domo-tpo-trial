<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CONCEPT MAP · 한국 세럼 10종</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#fafafa; --card:#ffffff; --sunken:#f7f7f7; --panel:#0f0f0f;
    --line:#e9e9e9; --line-strong:#d9d9d9;
    --ink:#171717; --sub:#454545; --muted:#5c5c5c; --subtle:#757575; --faint:#bfbfbf;
    --claim:#c2410c; --want:#4f46e5; --up:#16a34a; --warn:#f59e0b; --bad:#ef4444;
    --claim-t:#fdf1ea; --want-t:#eeecfc;
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--canvas);color:var(--ink);
       font-family:Inter,"Noto Sans KR",ui-sans-serif,system-ui,-apple-system,sans-serif;
       font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .mono{font-family:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
  b,strong{font-weight:600}
  a{color:inherit}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;
       padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .top h1{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
  .kick{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);font-weight:500;
        font-family:"Geist Mono",ui-monospace,monospace}
  .top .sub{font-size:12.5px;color:var(--subtle);margin-top:4px}
  .topmeta{display:flex;gap:16px;font-size:11px;color:var(--subtle);flex-wrap:wrap;align-items:center}
  .topmeta b{color:var(--ink);font-weight:500}

  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 13px;min-height:88px;
        display:flex;flex-direction:column;justify-content:space-between}
  .tile .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--subtle);font-weight:500;
           font-family:"Geist Mono",ui-monospace,monospace}
  .tile .v{font-size:25px;font-weight:500;letter-spacing:-.02em;margin-top:7px;line-height:1.05;
           font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;font-weight:400;color:var(--subtle)}
  .tile .s{font-size:10.5px;color:var(--subtle);margin-top:6px;line-height:1.4}
  .tile.hero{background:var(--panel);border-color:var(--panel);color:#fff}
  .tile.hero .k,.tile.hero .s{color:#8f8f8f} .tile.hero .v small{color:#8f8f8f}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 17px;margin-top:14px}
  .ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .ph h3{font-size:13px;font-weight:600}
  .ph .hint{font-size:10.5px;color:var(--subtle);max-width:640px;text-align:right}
  .ib{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;flex:0 0 13px;
     border:1px solid #dcdcdc;border-radius:50%;font-size:8.5px;font-style:normal;font-weight:600;
     color:var(--subtle);cursor:help;margin-left:6px;line-height:1;position:relative;top:-1px}
  .ib:hover{border-color:#a8a8a8;color:var(--ink);background:#f2f2f2}
  .panel p{font-size:12.5px;color:var(--muted);margin:8px 0}
  .panel ul{margin:8px 0 2px 16px} .panel li{font-size:12.5px;color:var(--muted);margin:6px 0}
  .panel li::marker{color:var(--faint)} .panel li b,.panel p b{color:var(--ink)}
  .sum .d1{font-size:16.5px;margin-bottom:10px;font-weight:600;line-height:1.55}
  .sum ul{margin:0 0 0 17px;columns:2;column-gap:34px}
  @media(max-width:939px){.sum ul{columns:1}}
  .sum li{font-size:13px;break-inside:avoid;margin:0 0 9px}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);font-weight:500;text-align:left;
     padding:0 10px 8px;font-family:"Geist Mono",ui-monospace,monospace}
  td{padding:9px 10px;border-top:1px solid var(--line);color:var(--muted);vertical-align:middle}
  td b{color:var(--ink)}
  td.n{text-align:right;font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--ink)}

  /* ---- 계열 요약 ---- */
  .famrow td{padding:11px 10px}
  .fbar{position:relative;height:7px;border-radius:3px;background:var(--sunken);overflow:hidden}
  .fbar i{position:absolute;left:0;top:0;height:100%;border-radius:3px}
  .fbar i.c{background:var(--claim)} .fbar i.w{background:var(--want)}
  .fb2{margin-top:4px}

  /* ---- 컨셉 갭 맵 ---- */
  .mapscroll{overflow-x:auto;padding-bottom:4px}
  /* table-layout:fixed 가 아니면 셀 안의 % 너비가 셀이 아니라 엉뚱한 상자를 기준으로 잡힌다(0.1%가 12px로 그려졌다). */
  table.map{border-collapse:separate;border-spacing:0;font-size:11.5px;min-width:876px;table-layout:fixed;width:100%}
  table.map th.cn{width:150px;text-align:left;position:sticky;left:0;background:var(--card);z-index:2}
  table.map th.pn{text-align:center;font-size:9.5px;letter-spacing:.02em;color:var(--sub);
                  font-family:Inter,"Noto Sans KR",sans-serif;text-transform:none;padding-bottom:9px}
  table.map td{border-top:1px solid var(--line);padding:4px 6px;vertical-align:middle}
  table.map td.cn{position:sticky;left:0;background:var(--card);z-index:1;font-size:11.5px;color:var(--ink);
                  white-space:nowrap;padding-left:0;padding-right:12px}
  table.map td.cn .fm{font-size:9px;color:var(--faint);font-family:"Geist Mono",ui-monospace,monospace;margin-left:5px}
  table.map tr.famhead td{background:var(--sunken);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
       color:var(--subtle);font-family:"Geist Mono",ui-monospace,monospace;padding:5px 8px;border-top:1px solid var(--line)}
  table.map tr.famhead td.cn{background:var(--sunken)}
  .cel{cursor:default}
  .cel i{display:block;height:5px;border-radius:2px;background:var(--claim);min-width:1px}
  .cel i.w{background:var(--want);margin-top:3px}
  .cel.over{background:var(--claim-t)} .cel.hole{background:var(--want-t)}
  .cel.zero i{background:#ececec}
  .legend{display:flex;gap:18px;font-size:10.5px;color:var(--subtle);margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{display:inline-block;width:16px;height:5px;border-radius:2px}
  .swb{display:inline-block;width:13px;height:13px;border-radius:3px;border:1px solid var(--line)}

  /* ---- 제품 선택 ---- */
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font:inherit;font-size:11.5px;padding:5px 11px;border:1px solid var(--line);background:var(--card);
      border-radius:6px;color:var(--subtle);cursor:pointer}
  .chip:hover{border-color:#a8a8a8;color:var(--ink)}
  .chip.on{background:var(--panel);border-color:var(--panel);color:#fff}
  .chip.sm{font-size:10.5px;padding:2px 8px;border-radius:5px}
  td.n.dim{color:var(--subtle);font-size:11.5px}
  .legend .chips{display:inline-flex;gap:4px;margin:0}
  .duo tbody tr:hover{background:var(--sunken)}


  /* ---- 컨셉 보드 ---- */
  .tile.hero2{background:var(--want);border-color:var(--want);color:#fff}
  .tile.hero2 .k,.tile.hero2 .s{color:#cdc9f7}
  .board{display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px;align-items:start}
  @media(min-width:1000px){.board{grid-template-columns:1fr 1fr}}
  .colh{padding:9px 12px;border-radius:8px;margin-bottom:10px}
  .colh h3{font-size:13px;font-weight:600}
  .colh span{display:block;font-size:10.5px;margin-top:3px;opacity:.85}
  .colh.ch1{background:var(--claim-t);color:#7c2d12}
  .colh.ch2{background:var(--want-t);color:#3730a3}
  .cc{display:grid;grid-template-columns:56px 1fr;gap:11px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
  .cc:first-of-type{border-top:0}
  .cc.dead{opacity:.55}
  .cc.u{grid-template-columns:1fr}
  .cc.u .cl{border-left:2px solid var(--want-t);padding-left:10px}
  .ct{display:block;width:56px;height:56px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--sunken)}
  .ct img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .ct.nt{display:block}
  .ch{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:12.5px}
  .ch b{color:var(--ink);font-weight:600}
  .src{font-size:9px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;font-family:"Geist Mono",ui-monospace,monospace;
       flex:0 0 auto;position:relative;top:-1px}
  .src.sd{background:#fdf1ea;color:#c2410c} .src.sa{background:#fff4e6;color:#b45309}
  .src.sb{background:#f1f1f1;color:#525252} .src.sr{background:#eeecfc;color:#4338ca}
  .src.su{background:#e8f2fe;color:#1d4ed8}
  .own{margin-left:auto;font-size:10px;color:var(--faint);font-family:"Geist Mono",ui-monospace,monospace;white-space:nowrap}
  .cl{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px}
  .echo{display:flex;align-items:center;gap:12px;margin-top:7px;flex-wrap:wrap}
  .echo .el{font-size:9.5px;color:var(--faint);font-family:"Geist Mono",ui-monospace,monospace}
  .echo .eb{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--subtle);min-width:118px}
  .echo .eb .tk{display:inline-block;width:46px;height:4px;border-radius:2px;background:#ececec;overflow:hidden;flex:0 0 46px}
  .echo .eb .tk i{display:block;height:100%;border-radius:2px}
  .echo .eb i.w{background:var(--want)} .echo .eb i.c{background:var(--claim)}
  .echo .eb b{font-family:"Geist Mono",ui-monospace,monospace;color:var(--ink);font-weight:500}
  .cq{margin-top:7px}
  .cq .quote{font-size:11px;margin:4px 0}

  /* ---- 제품 카드 ---- */
  .prod{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start}
  .prod img.pimg{width:92px;height:92px;object-fit:contain;border:1px solid var(--line);border-radius:8px;grid-row:1/3;background:#fff}
  .prod .pt{font-size:14.5px;font-weight:600;line-height:1.4}
  .prod .pa{font-size:10.5px;color:var(--subtle);margin-top:5px;letter-spacing:.04em;
            font-family:"Geist Mono",ui-monospace,monospace}
  .prod .plink{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
  .prod .plink a{font-size:11px;border:1px solid var(--line);padding:3px 9px;border-radius:6px;text-decoration:none;color:var(--muted)}
  .prod .plink a:hover{border-color:#a8a8a8;color:var(--ink)}
  .pf{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px;grid-column:2}
  .pf .k{font-size:10.5px;color:var(--subtle)}
  .pf .v{font-size:16px;font-weight:500;margin-top:2px;font-family:"Geist Mono",ui-monospace,monospace;
         font-variant-numeric:tabular-nums;white-space:nowrap}
  .pf .v small{font-size:11px;color:var(--subtle);font-weight:400}

  /* ---- duo ---- */
  .duo td{padding:6px 8px}
  .duo .lab{text-align:center;color:var(--ink);font-weight:500;width:150px;font-size:12px}
  .duo .bl i{display:block;height:7px;border-radius:3px;background:var(--claim);margin-left:auto}
  .duo .br i{display:block;height:7px;border-radius:3px;background:var(--want)}
  .duo .bl{width:32%} .duo .br{width:32%}
  .duo .vl{font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);width:44px;text-align:right}
  .duo .vr{font-family:"Geist Mono",ui-monospace,monospace;font-size:11.5px;color:var(--muted);width:44px}

  .three{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px}
  @media(min-width:900px){.three{grid-template-columns:1fr 1fr 1fr}}
  .box{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--sunken)}
  .box .bt{font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px}
  .box .bs{font-size:10.5px;color:var(--subtle);margin-top:3px;line-height:1.5}
  .box ul{margin:8px 0 0 15px} .box li{font-size:12px;margin:4px 0;color:var(--muted)}
  .box li b{color:var(--ink)}
  .dotc{width:7px;height:7px;border-radius:50%;display:inline-block}

  .axl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;
       font-family:"Geist Mono",ui-monospace,monospace;margin:0 0 6px}
  .quote{border-left:2px solid var(--line-strong);padding:2px 0 2px 11px;margin:7px 0;font-size:12px;
         color:var(--muted);line-height:1.65}
  .qk{font-size:10.5px;color:var(--want);font-weight:600;margin-top:12px}

  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;max-height:520px;overflow:auto}
  .gal a{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunken);position:relative}
  .gal img{width:100%;display:block;height:170px;object-fit:cover;object-position:top}
  .gal .no{position:absolute;left:6px;top:6px;background:rgba(15,15,15,.72);color:#fff;font-size:9.5px;
           padding:1px 6px;border-radius:4px;font-family:"Geist Mono",ui-monospace,monospace}

  .adL{max-height:520px;overflow:auto;padding-right:6px}
  .adL::-webkit-scrollbar,.ug::-webkit-scrollbar,.gal::-webkit-scrollbar{width:8px}
  .adL::-webkit-scrollbar-thumb,.ug::-webkit-scrollbar-thumb,.gal::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
  .ad{display:grid;grid-template-columns:56px 1fr;gap:11px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
  .ad:first-child{border-top:0}
  .adthumb{width:56px;height:56px;border-radius:7px;background:var(--sunken);border:1px solid var(--line);
           display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--faint);overflow:hidden}
  .adthumb img{width:100%;height:100%;object-fit:cover}
  .adpg{font-size:11.5px;font-weight:600}
  .adtx{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.55;white-space:pre-wrap;
        display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .ad.open .adtx{-webkit-line-clamp:unset}
  .admeta{font-size:9.5px;color:var(--faint);margin-top:5px;font-family:"Geist Mono",ui-monospace,monospace}

  .ug{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px;max-height:520px;overflow:auto;padding-right:6px}
  .ugc{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card);text-decoration:none;display:block}
  .ugc:hover{border-color:#a8a8a8}
  .ugc img{width:100%;height:104px;object-fit:cover;display:block;background:var(--sunken)}
  .ugc .noimg{height:104px;display:flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--faint);font-size:10.5px}
  .ugc .m{padding:8px 9px 10px}
  .ugc .t{font-size:11.5px;line-height:1.45;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ugc .c{font-size:10px;color:var(--subtle);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
  .ugc .c b{font-family:"Geist Mono",ui-monospace,monospace;color:var(--muted);font-weight:500}
  .w{font-size:9.5px;padding:1px 6px;border-radius:5px;background:var(--sunken);color:var(--subtle)}

  .cols2{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px;align-items:start}
  @media(min-width:940px){.cols2{grid-template-columns:1fr 1fr}}

  .foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--subtle);line-height:1.75}
  .foot b{color:var(--muted)}
  .tip{position:fixed;z-index:99;max-width:340px;background:var(--panel);color:#e8e8e8;font-size:11.5px;line-height:1.65;
       padding:9px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);pointer-events:none;opacity:0;transition:opacity .1s}
  .tip.on{opacity:1}
  .lb{position:fixed;inset:0;background:rgba(15,15,15,.9);z-index:200;display:none;overflow:auto;padding:26px}
  .lb.on{display:block}
  .lb img{display:block;margin:0 auto 10px;max-width:820px;width:100%;border-radius:6px}
  .lb .x{position:fixed;right:18px;top:14px;color:#fff;font-size:13px;cursor:pointer;
         border:1px solid #555;border-radius:6px;padding:4px 10px;background:rgba(0,0,0,.5)}
  @media(max-width:640px){.wrap{padding:18px 13px 60px}.tile .v{font-size:21px}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="lb" id="lb"><span class="x" id="lbx">닫기 ESC</span><div id="lbc"></div></div>
<script src="concept-data.js"></script>
<script src="app.js"></script>
</body>
</html>
