<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>쿨링·진정 식물 원료 전수 조사</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#fafafa; --card:#ffffff; --sunken:#f7f7f7; --panel:#0f0f0f;
    --line:#e9e9e9; --line-strong:#d9d9d9;
    --ink:#171717; --sub:#454545; --muted:#5c5c5c; --subtle:#757575; --faint:#bfbfbf;
    --cool:#0e7490; --cool-t:#e8f6f9; --soothe:#c2410c; --soothe-t:#fdf1ea;
    --up:#16a34a; --bad:#ef4444; --none:#4f46e5; --none-t:#eeecfc;
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--canvas);color:var(--ink);
       font-family:Inter,"Noto Sans KR",ui-sans-serif,system-ui,-apple-system,sans-serif;
       font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .mono{font-family:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
  b,strong{font-weight:600}
  a{color:inherit}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;
       padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .top h1{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
  .kick{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);font-weight:500;
        font-family:"Geist Mono",ui-monospace,monospace}
  .top .sub{font-size:12.5px;color:var(--subtle);margin-top:4px;max-width:720px}
  .topmeta{display:flex;gap:16px;font-size:11px;color:var(--subtle);flex-wrap:wrap;align-items:center}
  .topmeta b{color:var(--ink);font-weight:500}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 17px;margin-top:14px}
  .ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .ph h3{font-size:13px;font-weight:600}
  .ph .hint{font-size:10.5px;color:var(--subtle);max-width:660px;text-align:right}
  .panel p{font-size:12.5px;color:var(--muted);margin:8px 0}
  .panel p b{color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:860px){.two{grid-template-columns:1fr}}

  .chip{display:inline-block;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:500;white-space:nowrap}
  .chip.cool{background:var(--cool-t);color:var(--cool)}
  .chip.soothe{background:var(--soothe-t);color:var(--soothe)}
  .chip.both{background:linear-gradient(90deg,var(--cool-t),var(--soothe-t));color:var(--sub)}
  .chip.none{background:var(--none-t);color:var(--none)}
  .chip.ev3{background:#e7f6ec;color:var(--up)}
  .chip.ev2{background:#f1f1f1;color:var(--sub)}
  .chip.ev1{background:#f7f7f7;color:var(--subtle)}
  .chip.ev0{background:#fbf7ee;color:#92700c}
  .warn{color:#b45309;font-size:10.5px}

  .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 4px}
  .bar div{height:100%}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--subtle);flex-wrap:wrap}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

  .mechs{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;margin-top:6px}
  .mech{background:var(--sunken);border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:12px;
        display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .mech b{font-size:13px}
  .mech span{color:var(--subtle);font-size:11px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:6px}
  .cardw{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;font-size:12.5px}
  .cardw h4{font-size:13.5px;font-weight:600;margin-bottom:1px}
  .cardw .lat{font-size:11px;color:var(--subtle);font-style:italic;margin-bottom:7px}
  .cardw .row{margin:4px 0;color:var(--muted)}
  .cardw .row b{color:var(--ink);font-weight:500}
  .cardw .ref{font-size:11px;color:var(--subtle);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line)}
  .cardw .ref a{color:var(--none);text-decoration:none}
  .cardw .ref a:hover{text-decoration:underline}

  .fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
  .fbar .grp{display:flex;gap:4px;background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:3px}
  .fbar button{border:0;background:transparent;font:inherit;font-size:11.5px;color:var(--subtle);
               padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .fbar button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07);font-weight:500}
  .fbar input{border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12px;padding:5px 11px;width:200px;background:#fff}
  .fbar input:focus{outline:none;border-color:var(--line-strong)}
  .fcount{font-size:11px;color:var(--subtle);margin-left:auto}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{font-size:10.5px;font-weight:500;color:var(--subtle);text-align:left;padding:7px 9px;
           border-bottom:1px solid var(--line-strong);white-space:nowrap;position:sticky;top:0;background:var(--card)}
  tbody td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr.r{cursor:pointer}
  tbody tr.r:hover td{background:var(--sunken)}
  td .lat{font-size:10.5px;color:var(--subtle);font-style:italic}
  td.acts,td.mechcell{color:var(--muted);font-size:11.5px}
  tr.detail td{background:var(--sunken);font-size:12px;color:var(--sub);padding:11px 14px 13px}
  tr.detail .drow{margin:3px 0}
  tr.detail .drow b{font-weight:500;color:var(--ink)}
  tr.detail a{color:var(--none);text-decoration:none;font-size:11.5px}
  tr.detail a:hover{text-decoration:underline}
  .tscroll{overflow-x:auto;margin:0 -17px;padding:0 17px}

  .foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--subtle);line-height:1.75}
  .foot b{color:var(--sub);font-weight:500}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
