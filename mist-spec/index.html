<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>미스트 제품 컨셉 후보 5 · 한국 10종 + 일본 5종</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#fafafa; --card:#ffffff; --sunken:#f7f7f7; --panel:#0f0f0f;
    --line:#e9e9e9; --line-strong:#d9d9d9;
    --ink:#171717; --sub:#454545; --muted:#5c5c5c; --subtle:#757575; --faint:#bfbfbf;
    --kr:#c2410c; --jp:#4f46e5; --up:#16a34a; --bad:#ef4444;
    --kr-t:#fdf1ea; --jp-t:#eeecfc;
    --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--canvas);color:var(--ink);
       font-family:Inter,"Noto Sans KR",ui-sans-serif,system-ui,-apple-system,sans-serif;
       font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .mono{font-family:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
  b,strong{font-weight:600}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;
       padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .top h1{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
  .kick{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--subtle);font-weight:500;
        font-family:"Geist Mono",ui-monospace,monospace}
  .top .sub{font-size:12.5px;color:var(--subtle);margin-top:4px}
  .topmeta{display:flex;gap:16px;font-size:11px;color:var(--subtle);flex-wrap:wrap;align-items:center}
  .topmeta b{color:var(--ink);font-weight:500}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 17px;margin-top:14px}
  .panel.dark{background:var(--panel);border-color:var(--panel);color:#fff}
  .ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .ph h3{font-size:13px;font-weight:600}
  .panel.dark .ph h3{color:#fff}
  .ph .hint{font-size:10.5px;color:var(--subtle);max-width:660px;text-align:right}
  .ib{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;flex:0 0 13px;
     border:1px solid #dcdcdc;border-radius:50%;font-size:8.5px;font-style:normal;font-weight:600;
     color:var(--subtle);cursor:help;margin-left:6px;line-height:1;position:relative;top:-1px}
  .ib:hover{border-color:#a8a8a8;color:var(--ink);background:#f2f2f2}
  .panel p{font-size:12.5px;color:var(--muted);margin:8px 0}
  .panel li b,.panel p b{color:var(--ink)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.two{grid-template-columns:1fr}}

  /* 답 */
  .ans .lead{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-bottom:4px}
  .ans .jp{font-size:13px;color:#8f8f8f;margin-bottom:16px;font-weight:400}
  .gap{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:10px;margin-top:4px}
  .gc{background:#1b1b1b;border:1px solid #2b2b2b;border-radius:8px;padding:11px 13px 12px}
  .gc .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:#8f8f8f;font-weight:500;
         font-family:"Geist Mono",ui-monospace,monospace}
  .gc .v{font-size:24px;font-weight:500;letter-spacing:-.02em;margin-top:6px;line-height:1.05;
         font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .gc .s{font-size:10.5px;color:#8f8f8f;margin-top:5px;line-height:1.4}
  .gc.dem .v{color:#a5b4fc} .gc.sup .v{color:#fb923c}

  /* 격자 */
  table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  th{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);font-weight:500;text-align:left;
     padding:0 8px 8px;font-family:"Geist Mono",ui-monospace,monospace}
  td{padding:8px;border-top:1px solid var(--line);color:var(--muted);vertical-align:middle}
  td b{color:var(--ink)}
  td.n{text-align:right;font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--ink)}
  table.auto{table-layout:auto}

  .cellgrid td{padding:5px 6px;text-align:center}
  .cellgrid td.lab{text-align:left;font-size:11.5px;color:var(--ink);font-weight:500;padding-left:2px}
  .cell{border:1px solid var(--line);border-radius:6px;padding:6px 4px 5px;background:var(--sunken)}
  .cell .duo{display:flex;justify-content:center;gap:7px;font-family:"Geist Mono",ui-monospace,monospace;
             font-variant-numeric:tabular-nums;font-size:12px;font-weight:500}
  .cell .duo .a{color:var(--kr)} .cell .duo .b{color:var(--jp)}
  .cell .bars{display:flex;gap:2px;height:4px;margin-top:5px;align-items:flex-end;justify-content:center}
  .cell .bars i{display:block;height:100%;border-radius:1px}
  .cell .bars i.a{background:var(--kr)} .cell .bars i.b{background:var(--jp)}
  .cell.hi{border-color:var(--line-strong);background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .lg{display:flex;gap:14px;font-size:10.5px;color:var(--subtle);align-items:center}
  .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;position:relative;top:1px}
  .lg i.a{background:var(--kr)} .lg i.b{background:var(--jp)}

  /* 막대 비교 */
  .cmp{display:grid;grid-template-columns:118px 1fr 1fr;gap:0 10px;align-items:center;margin:7px 0}
  .cmp .cl{font-size:12px;color:var(--ink)}
  .cmp .side{display:flex;align-items:center;gap:7px}
  .cmp .tk{flex:1;height:7px;background:var(--sunken);border-radius:3px;overflow:hidden}
  .cmp .tk i{display:block;height:100%;border-radius:3px}
  .cmp .tk i.a{background:var(--kr)} .cmp .tk i.b{background:var(--jp)}
  .cmp .nm{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:11.5px;
           width:44px;text-align:right;color:var(--ink)}

  .pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid var(--line-strong);
        color:var(--subtle);font-family:"Geist Mono",ui-monospace,monospace;margin-left:6px}
  .pill.kr{border-color:#f0c8b0;background:var(--kr-t);color:#9a3412}
  .pill.jp{border-color:#cfcaf7;background:var(--jp-t);color:#3730a3}
  .pos{color:var(--up)} .neg{color:var(--bad)}

  .rule{list-style:none;margin:0}
  .rule li{border-top:1px solid var(--line);padding:11px 0 12px}
  .rule li:first-child{border-top:0;padding-top:2px}
  .rule .rh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .rule .rt{font-size:14px;font-weight:600;color:var(--ink)}
  .rule .rn{font-size:11px;color:var(--subtle);font-family:"Geist Mono",ui-monospace,monospace}
  .rule .rb{font-size:12px;color:var(--muted);margin-top:5px}
  .rule .rb b{color:var(--ink)}

  .kill li{border-top:1px solid var(--line);padding:10px 0}
  .kill li:first-child{border-top:0}
  .kill .t{font-size:13px;font-weight:600;color:var(--ink)}
  .kill .t s{color:var(--faint);font-weight:500}
  .kill .b{font-size:12px;color:var(--muted);margin-top:4px}

  /* 후보 색인 */
  .cidx{list-style:none;margin:2px 0 0}
  .cidx li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid #262626;flex-wrap:wrap}
  .cidx li:first-child{border-top:0}
  .ci-r{color:#6f6f6f;font-size:11px;width:14px;flex:0 0 14px}
  .ci-m{font-size:10px;padding:1px 7px;border-radius:20px;border:1px solid #3a3a3a;color:#b5b5b5;flex:0 0 auto}
  .ci-m.kr{color:#fdba74;border-color:#7c2d12} .ci-m.jp{color:#a5b4fc;border-color:#312e81}
  .ci-n{font-size:13.5px;font-weight:600;color:#fff}
  .ci-k{margin-left:auto;font-size:10.5px;color:#8f8f8f;text-align:right}
  @media(max-width:760px){.ci-k{margin-left:24px;flex-basis:100%}}

  /* 후보 카드 */
  .cand{padding-top:14px}
  .ch{display:flex;align-items:flex-start;gap:11px;flex-wrap:wrap;margin-bottom:11px}
  .cr{font-size:20px;font-weight:600;color:var(--faint);line-height:1.2;flex:0 0 auto}
  .ct{min-width:220px;flex:1}
  .cn{font-size:16.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
  .cj{font-size:11.5px;color:var(--subtle);margin-top:2px}
  .cp{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding-top:3px}
  .cp .pill{margin-left:0}
  .evrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 10px}
  @media(max-width:860px){.evrow{grid-template-columns:1fr}}
  .evb{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:9px 12px 10px}
  .evh{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--subtle);font-weight:500;
       font-family:"Geist Mono",ui-monospace,monospace;margin-bottom:5px}
  table.ev{table-layout:auto}
  table.ev td{border-top:0;padding:3px 0;font-size:12px}
  table.ev .ek{color:var(--muted);white-space:nowrap;padding-right:10px}
  table.ev .evv{color:var(--ink);font-weight:500;white-space:nowrap;padding-right:10px}
  table.ev .es{color:var(--subtle);font-size:11px}
  .why{margin:2px 0 10px 16px}
  .why li{font-size:12.5px;color:var(--muted);margin:5px 0}
  .why li::marker{color:var(--faint)}
  table.sub{margin:2px 0 10px}
  .qt{font-size:12px;color:var(--muted);border-left:2px solid var(--line-strong);padding:2px 0 2px 10px;margin:7px 0}
  .qt .pill{margin:0 4px 0 0}
  .qko{color:var(--subtle);font-size:11px;margin-top:2px}
  .risk{font-size:11.5px;color:var(--muted);background:var(--sunken);border-radius:7px;padding:8px 11px;margin-top:11px}
  .risk b{font-size:10px;letter-spacing:.09em;color:var(--subtle);margin-right:6px;text-transform:uppercase;
          font-family:"Geist Mono",ui-monospace,monospace}

  /* 원자료 열람 */
  .evbtns{display:inline-flex;gap:8px;margin-left:8px;flex-wrap:wrap}
  .evlink,.evfl{font-size:10.5px;color:var(--ink);text-decoration:underline;text-underline-offset:2px;cursor:pointer;
          font-family:"Geist Mono",ui-monospace,monospace;white-space:nowrap}
  .evlink:hover,.evfl:hover{color:var(--kr)}
  a.evfl{color:inherit}
  .evpane{background:var(--sunken);border:1px solid var(--line);border-radius:8px;padding:10px 13px 12px;margin:10px 0;
          max-height:520px;overflow-y:auto}
  .evhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px;position:sticky;top:-10px;
        background:var(--sunken);padding:4px 0 6px;border-bottom:1px solid var(--line);z-index:2}
  .evhd b{font-size:12px}
  .evcnt{font-size:11px;color:var(--subtle)}
  .evq{border:1px solid var(--line-strong);border-radius:6px;padding:2px 8px;font-size:11.5px;width:150px;background:#fff;
       font-family:inherit;color:var(--ink)}
  .evq:focus{outline:none;border-color:#a8a8a8}
  .evnote{font-size:10px;color:var(--subtle)}
  .evclose{margin-left:auto;font-size:10.5px;color:var(--subtle);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .evr{display:flex;align-items:baseline;gap:7px;padding:4px 0;border-top:1px solid var(--line);font-size:11.5px}
  .evr:first-of-type{border-top:0}
  .evr .pill{margin:0;flex:0 0 auto}
  .evd{font-size:10px;color:var(--faint);flex:0 0 auto}
  .evt{color:var(--muted);line-height:1.55;word-break:break-word}
  .evtw{flex:1;min-width:0}
  .evko{color:var(--subtle);font-size:10.5px;line-height:1.5;margin-top:1px;word-break:break-word}
  .bpill{font-size:9.5px;padding:0 6px;border-radius:20px;border:1px solid #bfe3c8;background:#effaf1;color:#15803d;
         flex:0 0 auto;font-family:"Geist Mono",ui-monospace,monospace}
  .bpill.npill{border-color:#f3c1c1;background:#fdf1f1;color:#b91c1c}
  .evmore{display:block;text-align:center;font-size:11px;color:var(--ink);cursor:pointer;padding:7px 0 2px;
          text-decoration:underline;text-underline-offset:2px}
  .evimg{max-width:340px;width:100%;border:1px solid var(--line);border-radius:6px;margin:6px 0}
  .evcell{cursor:pointer}
  .evcell:hover{border-color:#a8a8a8}

  .foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--subtle);line-height:1.75}
  .foot b{color:var(--sub)}
  .quote{font-size:12px;color:var(--muted);border-left:2px solid var(--line-strong);padding-left:10px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
